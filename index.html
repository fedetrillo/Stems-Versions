<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Stems &amp; Versions</title>
  <style>
    :root, [data-theme="dark"] {
      --plate: #141619; --panel: #1d2024; --panel2: #24282d; --well: #101215; --edge: #2c3036;
      --text: #f1f0ec; --dim: #858a93; --silk: #b9bdc5; --grid: #1f2328; --bar: #2f343b;
      --ok: #3ddc84; --bad: #ff5a6a; color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4a4e55; --panel: #555a62; --panel2: #5d626a; --well: #41454b; --edge: #6a6f78;
      --text: #f6f5f1; --dim: #c9ccd1; --silk: #e1e3e6; --grid: #484c53; --bar: #5a5f67;
      --ok: #7ef0ae; --bad: #ff9aa3;
    }
    [data-color="yellow"] { --acc: #ffd23f; --acc2: #f5a623; --ink: #1f1600; }
    [data-color="orange"] { --acc: #ffa94d; --acc2: #ff6b3d; --ink: #1f0c00; }
    [data-color="red"]    { --acc: #ff6b6b; --acc2: #e0334f; --ink: #1f0508; }
    [data-color="green"]  { --acc: #2ee6a6; --acc2: #9be14a; --ink: #0b1a10; }
    [data-color="blue"]   { --acc: #4cc3ff; --acc2: #5b6cff; --ink: #06131f; }
    [data-color="pink"]   { --acc: #ff86c8; --acc2: #ff4f8b; --ink: #1f0612; }
    [data-color="purple"] { --acc: #c08bff; --acc2: #7b5cff; --ink: #12081f; }
    [data-theme="grey"][data-color="yellow"] { --acc: #ffdc66; --acc2: #ffb648; }
    [data-theme="grey"][data-color="orange"] { --acc: #ffbd73; --acc2: #ff8a63; }
    [data-theme="grey"][data-color="red"]    { --acc: #ff8f8f; --acc2: #ff5c74; }
    [data-theme="grey"][data-color="green"]  { --acc: #5ff0bd; --acc2: #b8ee7a; }
    [data-theme="grey"][data-color="blue"]   { --acc: #7fd4ff; --acc2: #8f9bff; }
    [data-theme="grey"][data-color="pink"]   { --acc: #ffa6d6; --acc2: #ff79a8; }
    [data-theme="grey"][data-color="purple"] { --acc: #d4adff; --acc2: #a08bff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 12.5px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; overflow: hidden; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    svg { display: block; }
    .top { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--edge); }
    h1 { flex: 1; white-space: nowrap; margin: 0; font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; cursor: default; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; }
    .theme button { width: 26px; height: 22px; border: 0; border-radius: 7px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel2); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 7px; font-size: 12px; font-weight: 700; }
    .colors { position: relative; }
    #colorBtn { width: 30px; height: 28px; border-radius: 9px; border: 1px solid var(--edge); background: var(--well); display: grid; place-items: center; padding: 0; }
    #colorBtn i, .sw { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(135deg, var(--acc), var(--acc2)); display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
    #colorBtn.open { border-color: var(--acc); }
    .menu { position: absolute; z-index: 30; top: calc(100% + 6px); right: 0; width: 150px; padding: 5px; background: var(--panel2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .menu[hidden] { display: none; }
    .menu button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 5px 8px; border-radius: 7px; font-weight: 700; font-size: 12px; text-align: left; }
    .menu button:hover { background: var(--well); }
    .menu button span { flex: 1; }
    .menu button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
    .menu button.on svg { visibility: visible; }


    main { flex: 1; min-height: 0; padding: 10px 12px; display: grid; grid-template-columns: 1fr 236px; grid-template-rows: auto 1fr; gap: 10px; }
    .bar { grid-column: 1 / -1; display: flex; gap: 14px; align-items: flex-end; background: var(--panel); border-radius: 14px; padding: 8px 12px; flex-wrap: wrap; }
    .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .f > label { color: var(--dim); font-size: 10.5px; font-weight: 800; white-space: nowrap; }
    .f input { background: var(--well); border: 1px solid var(--edge); border-radius: 8px; padding: 4px 8px; font-weight: 700; font-size: 12px; width: 140px; }
    .f input:focus { outline: none; border-color: var(--acc); }
    .seg { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 9px; padding: 2px; gap: 2px; min-width: 0; }
    .seg button { border: 0; background: none; border-radius: 7px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; color: var(--dim); white-space: nowrap; }
    .seg button:hover { color: var(--text); }
    .seg button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 55%, transparent); }
    .mk { display: flex; gap: 4px; align-items: center; }
    .mk select { max-width: 120px; }
    .mk[hidden] { display: none; }
    .card { background: var(--panel); border-radius: 16px; padding: 10px 12px; min-height: 0; }
    .card h2 { margin: 0 0 4px; font-size: 10.5px; color: var(--dim); font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .card h2 span { flex: 1; }
    #matrix { display: flex; flex-direction: column; }
    .scroll { flex: 1; min-height: 0; overflow: auto; }
    table { border-collapse: separate; border-spacing: 0; font-size: 11.5px; }
    th { height: 104px; vertical-align: bottom; padding: 0 0 5px; font-weight: 800; color: var(--silk); position: sticky; top: 0; background: var(--panel); z-index: 2; }
    th.v { width: 32px; min-width: 32px; cursor: pointer; }
    th.v .vl { display: inline-block; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; max-height: 92px; overflow: hidden; text-overflow: ellipsis; }
    th.v.off { color: var(--dim); opacity: .45; text-decoration: line-through; }
    th.v .x { display: block; margin: 3px auto 0; width: 16px; height: 16px; border-radius: 5px; border: 0; background: none; color: var(--dim); font-size: 11px; line-height: 16px; padding: 0; visibility: hidden; }
    th.v:hover .x { visibility: visible; }
    th.v .x:hover { color: var(--bad); }
    th.v input { width: 78px; writing-mode: horizontal-tb; font-size: 11px; padding: 2px 4px; background: var(--well); border: 1px solid var(--acc); border-radius: 6px; position: absolute; bottom: 6px; left: 0; z-index: 5; }
    th.plus { width: 34px; }
    th.plus button { width: 24px; height: 24px; border-radius: 8px; border: 1px dashed var(--edge); background: none; color: var(--dim); font-weight: 800; font-size: 15px; line-height: 1; padding: 0; }
    th.plus button:hover { color: var(--acc); border-color: var(--acc); }
    th.cap { text-align: left; color: var(--dim); font-size: 10.5px; padding-right: 8px; }
    td { text-align: center; padding: 3px 0; border-top: 1px solid var(--grid); height: 26px; }
    td.c { cursor: pointer; }
    td.c:hover { background: color-mix(in srgb, var(--acc) 8%, transparent); }
    td.c.off-col { opacity: .35; }
    td.tn { text-align: left; font-weight: 700; white-space: nowrap; padding-right: 6px; }
    td.tn .in { display: flex; align-items: center; gap: 7px; }
    td.tn .nm { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    td.tn .mb { font-size: 9px; font-weight: 800; color: var(--bad); border: 1px solid currentColor; border-radius: 4px; padding: 0 3px; }
    tr.muted td.tn .nm { color: var(--dim); text-decoration: line-through; }
    td.tn select { margin-left: auto; font-size: 10.5px; padding: 1px 4px; border-radius: 6px; color: var(--dim); background: var(--well); border-color: transparent; font-weight: 700; }
    td.tn select:hover { border-color: var(--edge); color: var(--text); }
    .chip { width: 4px; height: 16px; border-radius: 2px; display: block; flex: none; background: var(--edge); }
    .d { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--edge); vertical-align: middle; }
    .d.on { background: linear-gradient(135deg, var(--acc), var(--acc2)); border-color: transparent; }
    .gn { display: inline-block; font-size: 10px; font-weight: 800; padding: 1px 4px; border-radius: 6px; background: var(--panel2); color: var(--acc); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 55%, transparent); }
    .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    #queue { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #qlist { flex: 1; overflow: auto; }
    .q { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid var(--grid); font-size: 12px; }
    .q { cursor: pointer; }
    .q input { margin: 0; accent-color: var(--acc2); }
    .q.skip b { color: var(--dim); font-weight: 700; text-decoration: line-through; }
    .q.skip .qi { visibility: hidden; }
    .mini { border: 1px solid var(--edge); background: var(--well); border-radius: 6px; font-size: 10px; font-weight: 800; padding: 1px 6px; color: var(--dim); }
    .mini:hover:not(:disabled) { color: var(--text); }
    .actions .dest { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 12px; padding: 0 10px; }
    .actions .dest label { color: var(--dim); font-size: 10.5px; font-weight: 800; white-space: nowrap; }
    .actions .dest .seg button { height: auto; border: 0; border-radius: 7px; font-size: 11.5px; padding: 4px 9px; background: none; }
    .actions .dest .seg button.on { background: var(--panel2); }
    .dest .seg button { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
    .q b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .q .qs { margin-left: auto; color: var(--dim); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .qi { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--edge); flex: none; }
    .q.done .qi { background: var(--ok); border-color: transparent; }
    .q.run .qi { background: var(--acc); border-color: transparent; box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 30%, transparent); }
    .q.fail .qi { background: var(--bad); border-color: transparent; }
    .q.wait b { color: var(--dim); font-weight: 700; }
    .prog { height: 5px; border-radius: 3px; background: var(--well); overflow: hidden; margin-top: 6px; }
    .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); transition: width .3s; }
    .hint { color: var(--dim); font-size: 11px; line-height: 1.4; }
    #about { font-size: 10.5px; line-height: 1.35; }
    .actions { display: flex; gap: 8px; padding: 0 12px 10px; }
    .actions button { height: 40px; border-radius: 12px; border: 1px solid var(--edge); background: var(--panel); font-weight: 800; font-size: 13px; padding: 0 16px; }
    .actions button:hover:not(:disabled) { border-color: var(--silk); }
    .actions .main { flex: 1; background: linear-gradient(90deg, var(--acc), var(--acc2)); border: 0; color: var(--ink); font-size: 14px; }
    .actions .main.stop { background: var(--panel2); color: var(--text); border: 1px solid var(--bad); }
    button:disabled { opacity: .35; cursor: default; }
    .foot { padding: 7px 12px; border-top: 1px solid var(--edge); min-height: 31px; }
    .status { font-size: 12px; color: var(--dim); text-align: center; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  </style>
</head>
<body>
  <div class="top">
    <h1>Stems &amp; Versions <small id="ver"></small></h1>
    <button id="help"></button>
    <div class="colors">
      <button id="colorBtn" aria-haspopup="true"><i></i></button>
      <div class="menu" id="colorMenu" hidden></div>
    </div>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </div>
  <main>
    <section class="bar">
      <div class="f"><label id="songLbl"></label><input id="song" spellcheck="false" maxlength="80"></div>
      <div class="f"><label id="rangeLbl"></label><div class="seg" id="range"></div></div>
      <div class="f" id="tailBox"><label id="tailLbl"></label><div class="seg" id="tail"></div></div>
      <div class="f mk" id="mk" hidden><select id="mkFrom"></select><span>→</span><select id="mkTo"></select></div>
      <div class="f"><label id="renderLbl"></label><div class="seg" id="render"></div></div>
    </section>
    <section class="card" id="matrix">
      <h2><span id="mTitle"></span><em class="hint" id="mHint" style="font-style:normal;font-weight:700"></em></h2>
      <div class="scroll"><table id="grid"></table></div>
    </section>
    <div class="side">
      <section class="card" id="queue">
        <h2><span id="qTitle"></span><button class="mini" id="qAll"></button><button class="mini" id="qNone"></button></h2>
        <div id="qlist"></div>
        <div class="prog"><i id="prog"></i></div>
      </section>
      <section class="card hint" id="about"></section>
    </div>
  </main>
  <div class="actions">
    <button id="restore" disabled></button>
    <div class="dest"><label id="destLbl"></label><div class="seg" id="dest"></div></div>
    <button id="reveal" disabled></button>
    <button id="go" class="main"></button>
  </div>
  <div class="foot"><div class="status" id="status" role="status"></div></div>
  <script src="vendor/luna.global.js"></script>
  <script src="tour.js"></script>
  <script src="logic.js"></script>
  <script src="main.js"></script>
</body>
</html>
